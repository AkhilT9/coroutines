{% if user.is_authenticated %}
<button hx-post="{% url 'like_toggle' post.id %}" hx-swap="outerHTML" title="Like"
        class="flex items-center gap-1.5 text-sm {% if post.viewer_liked %}text-pink-500{% else %}hover:text-pink-500{% endif %}">
  <svg class="h-[18px] w-[18px]" fill="{% if post.viewer_liked %}currentColor{% else %}none{% endif %}" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"/></svg>
  {{ post.like_count }}
</button>
{% else %}
<a href="{% url 'login' %}?next={{ request.path }}" class="flex items-center gap-1.5 text-sm hover:text-pink-500">
  <svg class="h-[18px] w-[18px]" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"/></svg>
  {{ post.like_count }}
</a>
{% endif %}

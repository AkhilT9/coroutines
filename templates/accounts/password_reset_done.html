{% extends "base_auth.html" %}
{% block title %}Check your email / coroutines{% endblock %}
{% block content %}
<h1 class="mb-2 text-2xl font-bold">Check your email</h1>
<p class="text-sm text-muted">If an account exists for that address, a reset link is on its way. It expires in a few hours. Check Spam if it doesn't show up.</p>
<p class="mt-6 text-center text-sm text-muted"><a href="{% url 'login' %}" class="text-accent hover:underline">Back to log in</a></p>
{% endblock %}

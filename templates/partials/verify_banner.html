<div class="flex items-center justify-between gap-3 border-b border-line bg-yellow-500/10 px-4 py-3 text-sm text-warn">
  <span>Confirm your email to start posting. We sent a link to <b>{{ user.email }}</b>.</span>
  <form method="post" action="{% url 'resend_verification' %}">{% csrf_token %}
    <button type="submit" class="whitespace-nowrap font-bold underline">Resend</button>
  </form>
</div>

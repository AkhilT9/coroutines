{% if user.is_authenticated %}
<button hx-post="{% url 'bookmark_toggle' post.id %}" hx-swap="outerHTML" title="Bookmark"
        class="flex items-center text-sm {% if post.viewer_bookmarked %}text-accent{% else %}hover:text-accent{% endif %}">
  <svg class="h-[18px] w-[18px]" fill="{% if post.viewer_bookmarked %}currentColor{% else %}none{% endif %}" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0Z"/></svg>
</button>
{% else %}
<a href="{% url 'login' %}?next={{ request.path }}" title="Bookmark" class="flex items-center text-sm hover:text-accent">
  <svg class="h-[18px] w-[18px]" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0Z"/></svg>
</a>
{% endif %}

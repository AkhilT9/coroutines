{% for item in items %}{% include "partials/post.html" %}{% empty %}
<div id="feed-empty" class="p-8 text-center text-muted">{{ empty_message|default:"Nothing to show yet." }}</div>
{% endfor %}
{% if next_url %}
<div hx-get="{{ next_url }}" hx-trigger="revealed" hx-swap="outerHTML" class="p-6 text-center text-sm text-muted">Loading more…</div>
{% endif %}

{% extends "base.html" %}
{% block title %}Edit post / coroutines{% endblock %}
{% block content %}
<div class="sticky top-0 z-10 border-b border-line bg-base/80 px-4 py-3 text-xl font-bold backdrop-blur">Edit post</div>
<form method="post" class="p-4" x-data="{ text: {{ form.content.value|default:''|escapejs|safe|stringformat:'r' }} }">
  {% csrf_token %}
  <textarea name="content" x-model="text" maxlength="280" rows="4"
            class="w-full resize-none rounded-md border border-line bg-base p-3 text-lg outline-none focus:border-accent">{{ form.content.value|default:'' }}</textarea>
  {{ form.content.errors }}
  <div class="mt-3 flex items-center justify-end gap-3">
    <span class="text-sm text-muted" x-text="280 - text.length"></span>
    <a href="{{ post.get_absolute_url }}" class="rounded-full px-4 py-2 text-sm font-bold text-muted hover:bg-surface">Cancel</a>
    <button type="submit" :disabled="!text.trim()" class="rounded-full bg-ink px-4 py-2 text-sm font-bold text-base hover:opacity-90 disabled:opacity-50">Save</button>
  </div>
</form>
{% endblock %}

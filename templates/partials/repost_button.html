{% if user.is_authenticated %}
<button hx-post="{% url 'repost_toggle' post.id %}" hx-swap="outerHTML" title="Repost"
        class="flex items-center gap-1.5 text-sm {% if post.viewer_reposted %}text-green-500{% else %}hover:text-green-500{% endif %}">
  <svg class="h-[18px] w-[18px]" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg>
  {{ post.repost_count }}
</button>
{% else %}
<a href="{% url 'login' %}?next={{ request.path }}" class="flex items-center gap-1.5 text-sm hover:text-green-500">
  <svg class="h-[18px] w-[18px]" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg>
  {{ post.repost_count }}
</a>
{% endif %}

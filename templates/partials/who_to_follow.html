<div class="rounded-2xl border border-line pb-2">
  <h3 class="px-4 pb-1 pt-3 font-display text-lg font-bold">Who to follow</h3>
  {% for u in suggestions %}
  <div class="flex items-center gap-3 px-4 py-2 hover:bg-dim">
    {% include "partials/avatar.html" with u=u %}
    <div class="min-w-0 flex-1">
      <a href="{{ u.get_absolute_url }}" class="block truncate text-sm font-bold hover:underline">{{ u.name }}</a>
      <div class="truncate text-sm text-muted">@{{ u.username }}</div>
    </div>
    {% include "partials/follow_button.html" with profile_user=u is_following=False %}
  </div>
  {% empty %}
  <p class="px-4 pb-1 text-sm text-muted">No one to suggest yet.</p>
  {% endfor %}
</div>

{% if plain %}<span class="flex shrink-0 select-none items-center justify-center rounded-full font-bold text-white {{ size|default:'h-10 w-10 text-base' }}" style="background: hsl({{ u.avatar_hue }} 55% 45%)">{{ u.initial }}</span>{% else %}<a href="{{ u.get_absolute_url }}" class="flex shrink-0 select-none items-center justify-center rounded-full font-bold text-white {{ size|default:'h-10 w-10 text-base' }}" style="background: hsl({{ u.avatar_hue }} 55% 45%)">{{ u.initial }}</a>{% endif %}
